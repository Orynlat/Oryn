<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ORYN — The Coordination Layer for Base">
  <defs>
    <style>
      .wm   { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; }
      .it   { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .ink  { fill: #111111; }
      .mut  { fill: #555555; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1280" height="360" fill="#F5F1EA"/>

  <!-- hand-drawn coordination nodes (right side) -->
  <g stroke="#111111" fill="none" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <circle cx="980" cy="120" r="30"/>
    <circle cx="1140" cy="90" r="20"/>
    <circle cx="1080" cy="240" r="38"/>
    <circle cx="920" cy="250" r="16"/>
    <circle cx="1180" cy="210" r="14"/>
  </g>
  <g stroke="#111111" fill="none" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.55">
    <path d="M1010 120 C 1070 100, 1110 95, 1122 92"/>
    <path d="M1100 150 C 1095 185, 1090 205, 1085 205"/>
    <path d="M955 135 C 935 175, 925 215, 922 236"/>
    <path d="M1115 230 C 1140 222, 1160 215, 1166 212"/>
  </g>
  <g class="mono" fill="#555555" font-size="11" text-anchor="middle" letter-spacing="1">
    <text x="980" y="124">people</text>
    <text x="1080" y="244">projects</text>
    <text x="1140" y="93">agents</text>
  </g>

  <!-- kicker -->
  <g transform="translate(96,86)">
    <circle cx="6" cy="-5" r="5" fill="#3a7d44"/>
    <text x="22" y="0" class="mono" font-size="13" letter-spacing="3" fill="#555555">AN OPEN RESEARCH INITIATIVE</text>
  </g>

  <!-- wordmark -->
  <text x="92" y="210" class="wm ink" font-size="132" letter-spacing="-2">ORYN</text>

  <!-- tagline -->
  <text x="98" y="262" class="it ink" font-size="34">The Coordination Layer for Base.</text>

  <!-- triplet -->
  <text x="100" y="312" class="mono mut" font-size="16" letter-spacing="2">Identity   ·   Reputation   ·   Coordination</text>
</svg>
