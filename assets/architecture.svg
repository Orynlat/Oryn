<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="ORYN architecture diagram">
  <defs>
    <style>
      .wm   { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="520" fill="#F5F1EA"/>

  <!-- title -->
  <text x="640" y="60" class="mono" font-size="13" letter-spacing="3" fill="#555555" text-anchor="middle">§ ARCHITECTURE — A SHARED COORDINATION FRAMEWORK</text>

  <!-- ORYN core -->
  <g>
    <rect x="465" y="100" width="350" height="180" rx="20" fill="#171513"/>
    <text x="640" y="150" class="wm" font-size="40" fill="#F5F1EA" text-anchor="middle" letter-spacing="3">ORYN</text>
    <line x1="505" y1="172" x2="775" y2="172" stroke="#3a3631" stroke-dasharray="3 4"/>
    <text x="640" y="198" class="mono" font-size="15" fill="#d8cfc0" text-anchor="middle">Identity</text>
    <text x="640" y="226" class="mono" font-size="15" fill="#d8cfc0" text-anchor="middle">Reputation</text>
    <text x="640" y="254" class="mono" font-size="15" fill="#d8cfc0" text-anchor="middle">Graph</text>
  </g>

  <!-- connectors -->
  <g stroke="#111111" stroke-width="1.6" fill="none" opacity="0.45">
    <path d="M640 280 L 200 380"/>
    <path d="M640 280 L 460 380"/>
    <path d="M640 280 L 640 380"/>
    <path d="M640 280 L 820 380"/>
    <path d="M640 280 L 1080 380"/>
  </g>

  <!-- participants -->
  <g class="mono" font-size="15" fill="#111111" text-anchor="middle">
    <g>
      <rect x="120" y="392" width="160" height="56" rx="14" fill="#F5F1EA" stroke="#111111" stroke-width="1.5"/>
      <text x="200" y="426">People</text>
    </g>
    <g>
      <rect x="380" y="392" width="160" height="56" rx="14" fill="#F5F1EA" stroke="#111111" stroke-width="1.5"/>
      <text x="460" y="426">Projects</text>
    </g>
    <g>
      <rect x="540" y="392" width="200" height="56" rx="14" fill="#F5F1EA" stroke="#111111" stroke-width="1.5"/>
      <text x="640" y="426">Communities</text>
    </g>
    <g>
      <rect x="760" y="392" width="160" height="56" rx="14" fill="#F5F1EA" stroke="#111111" stroke-width="1.5"/>
      <text x="840" y="426">Assets</text>
    </g>
    <g>
      <rect x="1000" y="392" width="160" height="56" rx="14" fill="#F5F1EA" stroke="#111111" stroke-width="1.5"/>
      <text x="1080" y="426">Agents</text>
    </g>
  </g>

  <text x="640" y="495" class="mono" font-size="13" fill="#555555" text-anchor="middle">Settles on Base · low-cost · high-throughput</text>
</svg>
